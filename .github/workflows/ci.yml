# Compila la solucion y corre los autotests offline del harness.
#
# Sin secretos a proposito: el repo es publico. Desde el paso B la app no tiene
# claves de proveedor; lo que va contra la API real (--verify-api,
# --api-process-file) se corre a mano con el token del harness. El
# appsettings.json de cada proyecto no esta en git; aca se arma desde el
# ejemplo, que solo tiene marcadores.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Configuracion de ejemplo (sin secretos)
        run: |
          foreach ($project in 'MeetingAssistant.App', 'MeetingAssistant.Harness') {
            Copy-Item "src/$project/appsettings.example.json" "src/$project/appsettings.json"
          }

      # Regla de AGENTS.md: Core no referencia ningun paquete.
      - name: Core sin paquetes
        run: |
          $references = Select-String -Path src/MeetingAssistant.Core/MeetingAssistant.Core.csproj -Pattern '<PackageReference'
          if ($references) { $references; throw 'MeetingAssistant.Core no puede referenciar paquetes.' }

      - name: Compilar
        run: dotnet build MeetingAssistant.sln -c Debug -warnaserror

      # Paso B (2026-11-10): el cliente de la API con un transporte falso, la
      # cola de subidas, la conversion a 16 kHz y la sesion del dispositivo.
      # Ninguno sale a la red.
      - name: Autotests offline
        run: |
          $tests = '--verify-api-client', '--verify-block-upload', '--verify-wav-convert', '--verify-device-auth',
                   '--verify-upload-queue', '--verify-api-services', '--verify-settings-config', '--verify-release'
          $failed = @()
          foreach ($test in $tests) {
            Write-Host "::group::$test"
            $output = dotnet run --project src/MeetingAssistant.Harness --no-build -- $test 2>&1
            $code = $LASTEXITCODE
            $output | Write-Host
            Write-Host '::endgroup::'
            $bad = @($output | Select-String -SimpleMatch '[MAL]').Count
            $acceptable = $code -eq 0 -and $bad -eq 0
            Write-Host ("{0,-26} exit {1}  MAL={2}" -f $test, $code, $bad)
            if (-not $acceptable) { $failed += $test }
          }
          if ($failed) { throw "Fallaron: $($failed -join ', ')" }
          exit 0
